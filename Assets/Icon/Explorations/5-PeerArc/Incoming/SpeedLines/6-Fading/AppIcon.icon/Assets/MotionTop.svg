<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Incoming, Speed Lines, Fading: Each streak in segments that brighten toward the file: a gradient made of opacity steps.
    Layer: MotionTop, the faintest, top segment of each streak. One layer per step so dark mode can set
    each step's opacity: a white dark-mode fill would flatten opacities drawn in one layer.
    Drawn in white: Icon Composer tints and lights the layer, so the artwork
    carries only shape and opacity.
  -->
