    <circle cx="345.7" cy="388.0" r="18.0" opacity="0.40"/>
    <circle cx="412.9" cy="309.4" r="21.0" opacity="0.51"/>
    <circle cx="512.0" cy="280.0" r="24.0" opacity="0.62"/>
    <circle cx="611.1" cy="309.4" r="27.0" opacity="0.74"/>
    <circle cx="678.3" cy="388.0" r="30.0" opacity="0.85"/>
  </g>
</svg>
