<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<!-- Send for Windows: the shipped folder icon redrawn in Fluent style (unplated,
     coloured, softly graded). Geometry is the Apple icon's (Apple/Wooosh/AppIcon.icon),
     scaled up to fill the frame; regenerate both together. The glyph is simple enough
     to hold up at every size, so one drawing serves from 16 px to the splash screen. -->
<defs>
  <linearGradient id="back" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#54A9EC"/><stop offset="1" stop-color="#3080C2"/></linearGradient>
  <linearGradient id="file" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DCEEFF"/></linearGradient>
  <linearGradient id="front" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8CCCFF"/><stop offset="1" stop-color="#4BA1EA"/></linearGradient>
  <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#0F314D" stop-opacity="0.32"/><stop offset="1" stop-color="#0F314D" stop-opacity="0"/></radialGradient>
</defs>
<g transform="translate(512 494) scale(1.49) translate(-512 -512)">
  <ellipse cx="512" cy="788" rx="290" ry="34" fill="url(#shadow)"/>
  <path d="M288 324H436A36 36 0 0 1 472 360V372H724A48 48 0 0 1 772 420V732A48 48 0 0 1 724 780H300A48 48 0 0 1 252 732V360A36 36 0 0 1 288 324Z" fill="url(#back)"/>
  <path d="M404 244H572L656 328V508A36 36 0 0 1 620 544H404A36 36 0 0 1 368 508V280A36 36 0 0 1 404 244Z" fill="url(#file)"/>
  <path d="M572 244V310A18 18 0 0 0 590 328H656Z" fill="#BCE0FF"/>
  <path d="M300 452H724A48 48 0 0 1 772 500V732A48 48 0 0 1 724 780H300A48 48 0 0 1 252 732V500A48 48 0 0 1 300 452Z" fill="#266DA8" opacity="0.25" transform="translate(0 -6)"/>
  <path d="M300 452H724A48 48 0 0 1 772 500V732A48 48 0 0 1 724 780H300A48 48 0 0 1 252 732V500A48 48 0 0 1 300 452Z" fill="url(#front)"/>
</g>
</svg>
