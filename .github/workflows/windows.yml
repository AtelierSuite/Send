name: Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["Windows/**", "Core/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["Windows/**", "Core/**", ".github/workflows/windows.yml"]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            rid: win-x64
            rust: x86_64-pc-windows-msvc
          - platform: ARM64
            rid: win-arm64
            rust: aarch64-pc-windows-msvc
    env:
      WOOOSH_RENDEZVOUS_URL: ${{ vars.WOOOSH_RENDEZVOUS_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Core
          key: ${{ matrix.rust }}

      - name: Build core
        working-directory: Core
        run: |
          cargo build --release -p wooosh-core --target ${{ matrix.rust }}
          New-Item -ItemType Directory -Force ..\Windows\Wooosh\Native\${{ matrix.platform }} | Out-Null
          Copy-Item target\${{ matrix.rust }}\release\wooosh_core.dll ..\Windows\Wooosh\Native\${{ matrix.platform }}\

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: microsoft/setup-msbuild@v2

      - name: Publish Send.exe
        run: |
          msbuild Windows\Wooosh\Wooosh.csproj -restore -t:Publish `
            -p:Configuration=Release `
            -p:Platform=${{ matrix.platform }} `
            -p:RuntimeIdentifier=${{ matrix.rid }} `
            "-p:PublishDir=$env:GITHUB_WORKSPACE/publish/"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem publish -Recurse -File | Format-Table Length, FullName -AutoSize | Out-String -Width 300

      - uses: actions/upload-artifact@v4
        with:
          name: Send-windows-${{ matrix.platform }}
          path: publish/Send.exe
          if-no-files-found: error
