name: Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["Windows/**", "Core/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["Windows/**", "Core/**", ".github/workflows/windows.yml"]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            rid: win-x64
            rust: x86_64-pc-windows-msvc
          - platform: ARM64
            rid: win-arm64
            rust: aarch64-pc-windows-msvc
    env:
      WOOOSH_RENDEZVOUS_URL: ${{ vars.WOOOSH_RENDEZVOUS_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Core
          key: ${{ matrix.rust }}

      - name: Build core
        working-directory: Core
        run: |
          cargo build --release -p wooosh-core --target ${{ matrix.rust }}
          New-Item -ItemType Directory -Force ..\Windows\Wooosh\Native\${{ matrix.platform }} | Out-Null
          Copy-Item target\${{ matrix.rust }}\release\wooosh_core.dll ..\Windows\Wooosh\Native\${{ matrix.platform }}\

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: microsoft/setup-msbuild@v2

      # Signed only when a certificate is configured, so fork PRs (no secrets)
      # still prove the build. The certificate subject must equal the
      # Publisher in Package.appxmanifest.
      - name: Build MSIX
        env:
          CERT_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $msbuildArgs = @(
            'Windows\Wooosh\Wooosh.csproj', '-restore',
            '-p:Configuration=Release',
            '-p:Platform=${{ matrix.platform }}',
            '-p:RuntimeIdentifier=${{ matrix.rid }}',
            '-p:GenerateAppxPackageOnBuild=true',
            '-p:UapAppxPackageBuildMode=SideloadOnly',
            '-p:AppxBundle=Never',
            "-p:AppxPackageDir=$env:GITHUB_WORKSPACE\AppPackages\"
          )
          if ($env:CERT_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP 'send.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_BASE64))
            $msbuildArgs += '-p:AppxPackageSigningEnabled=true', "-p:PackageCertificateKeyFile=$pfx", "-p:PackageCertificatePassword=$env:CERT_PASSWORD"
          } else {
            $msbuildArgs += '-p:AppxPackageSigningEnabled=false'
          }
          msbuild @msbuildArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: send-windows-${{ matrix.platform }}
          path: AppPackages/**

      - if: always()
        run: Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP 'send.pfx')
