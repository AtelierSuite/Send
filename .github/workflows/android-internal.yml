name: Build and Deploy to Play Store

on:
  workflow_dispatch:
    inputs:
      status:
        description: Release status. Use draft until the app has been published to any track once.
        type: choice
        options: [completed, draft]
        default: completed
  push:
    branches: [main]
    paths: ["Android/**", "Core/**", ".github/workflows/android-internal.yml"]

concurrency:
  group: android-internal
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WOOOSH_RENDEZVOUS_URL: ${{ vars.WOOOSH_RENDEZVOUS_URL }}
    steps:
      - uses: actions/checkout@v4

      # 17 for the Kotlin toolchain, 21 for the Gradle daemon (gradle-daemon-jvm.properties).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Core

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      # The committed jniLibs can lag the Rust source, so a release always rebuilds
      # the core. Mirrors the Android lane of Core/build-bindings.sh, which also
      # needs xcodebuild and cannot run here.
      - name: Build core and Kotlin bindings
        working-directory: Core
        run: |
          # Set by the runner image, so invisible to the env context in YAML.
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo build --release -p wooosh-core
          rm -rf bindings/kotlin
          cargo run --release -p uniffi-bindgen -- generate \
            --library target/release/libwooosh_core.so \
            --language kotlin --out-dir bindings/kotlin
          rm -rf dist/jniLibs
          cargo ndk -t arm64-v8a -t x86_64 -o dist/jniLibs build --release -p wooosh-core
          find dist/jniLibs -name '*.so' ! -name 'libwooosh_core.so' -delete

          APP=../Android/app/src/main
          KT=java/uniffi/wooosh_core/wooosh_core.kt
          if ! cmp -s "bindings/kotlin/uniffi/wooosh_core/wooosh_core.kt" "$APP/$KT"; then
            echo "::warning::Committed Kotlin bindings are stale. Run Core/build-bindings.sh and re-copy them into Android/app/src/main/."
          fi
          cp bindings/kotlin/uniffi/wooosh_core/wooosh_core.kt "$APP/$KT"
          rm -rf "$APP/jniLibs" && cp -R dist/jniLibs "$APP/jniLibs"

      - name: Decode upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "WOOOSH_UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      # Play rejects a versionCode it has seen, so it comes from the run number,
      # offset past anything uploaded by hand before this workflow existed.
      - name: Build bundle
        working-directory: Android
        env:
          WOOOSH_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          WOOOSH_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          WOOOSH_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          VERSION_CODE=$(( ${{ github.run_number }} + ${{ vars.ANDROID_VERSION_CODE_OFFSET || 0 }} ))
          ./gradlew bundleRelease -Pwooosh.versionCode="$VERSION_CODE" \
            -Pwooosh.playCloudProjectNumber="${{ vars.PLAY_CLOUD_PROJECT_NUMBER }}"

      - uses: actions/upload-artifact@v4
        with:
          name: send-android-${{ github.run_number }}
          path: Android/app/build/outputs/bundle/release/*.aab

      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.tsubuzaki.WoooshGo
          releaseFiles: Android/app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          # PLAY_RELEASE_STATUS=draft while the app has never been rolled out,
          # because Play then rejects every other status.
          status: ${{ inputs.status || vars.PLAY_RELEASE_STATUS || 'completed' }}

      - if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
